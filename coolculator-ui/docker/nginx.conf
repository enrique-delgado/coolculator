server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Liveness probe — same convention as the backend's GET /health, so
    # Docker/Compose/a cloud platform can check this container the same way.
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # There's only one real route today (no client-side router), but
    # falling back to index.html for anything unrecognized is standard SPA
    # practice and costs nothing to have in place before it's needed.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed asset filenames (Vite's build output) are safe to cache
    # indefinitely; index.html and runtime-config.js are not — they're what
    # must be re-fetched to pick up a new deploy or a new API_BASE_URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /runtime-config.js {
        add_header Cache-Control "no-cache";
    }
}
